name: desktop-native

# M2b.8 leg 3 — native tauri-driver E2E harness.
#
# ── PROMOTION STATUS (2026-11-12, PR 12) ──
#   Legs 1 (cargo check) + 2 (tauri build) are now in `.github/workflows/ci.yml`
#   as the additive `rust` job, on `push`/`pull_request` — first Linux run was
#   green (workflow_dispatch run 43135310353, main @ f1f9845, ~21m54s on Ubuntu
#   26). This file is now a *placeholder* for leg 3 only.
#
#   When the tauri-driver E2E harness lands in
#   `apps/desktop/src-tauri/tests/` (a `tauri-test` crate driving `tauri-driver`),
#   the leg-3 step is promoted into `ci.yml`'s `rust` job (after the `cargo check`/
#   `tauri build` legs) and this file is deleted. Until then, leg 3 is a documented
#   no-op gated on the `include_e2e` `workflow_dispatch` input.
#
# ── WHY LEG 3 IS NOT on push/PR ──
#   1. The harness itself does not exist yet — it is the M2b.8 part 3 work that
#      lands in `apps/desktop/src-tauri/tests/` and is gated on a `tauri-test`
#      crate (a fresh Cargo dependency).
#   2. tauri-driver drives ONLY Linux/webkit2gtk — macOS's WKWebView is
#      undrivable — so this leg's signal is *Linux CI only*.
#   3. Binding it on push/PR before the harness exists would be a red signal with
#      no content (the step would no-op or skip, but the gate noise would be a
#      real cost on every PR).
#
# ── LEG 3's eventual shape (when the harness lands) ──
#   1. `cargo check` + `tauri build --no-bundle --debug` (already in ci.yml's `rust` job).
#   2. `pnpm --filter @spherewiki/desktop exec tauri-driver` — drives a test-build
#      of the binary + `eval_js` against the webview to exercise the
#      fs + DuckDB path end-to-end. The browser Playwright suite has no
#      filesystem, so it can't reach this signal.
#
# Promotion path (docs/Todo.md, M2b.8 parts 1 + 3, "Promotion path"):
#   (a) legs 1+2 green once → move them into ci.yml ✅ (this PR)
#   (b) leg 3 green when the harness ships → promote the native-E2E leg
#   (c) delete this file once fully absorbed

on:
  workflow_dispatch:
    # Keep the knob so the leg-3 step's `if:` gate has a real input once the
    # harness lands; off by default because the harness does not exist yet.
    inputs:
      include_e2e:
        description: "M2b.8 part 3 — run the native tauri-driver E2E leg (experimental; harness not yet built)."
        type: boolean
        default: false

jobs:
  native:
    name: rust · tauri (Linux, webkit2gtk) — leg 3 placeholder
    runs-on: ubuntu-latest
    steps:
      # (3) native E2E (part 3) — PENDING. tauri-driver launches a test-build of
      #     the app and drives the webview via `eval_js`; it is the only way to
      #     exercise the fs + DuckDB path end-to-end (the browser Playwright suite
      #     has no filesystem, so it can't). No native E2E harness exists yet —
      #     it is the work that lands in `apps/desktop/src-tauri/tests/` + a
      #     `tauri-test` crate — so this leg is a no-op-with-notes until then:
      #     a real step is `pnpm --filter @spherewiki/desktop exec tauri-driver`.
      #     macOS's WKWebView is NOT tauri-driver-drivable, so verify the native
      #     shell manually on Linux or via the /verify skill in the meantime.
      - name: native E2E (tauri-driver) — PENDING M2b.8 part 3 harness
        if: ${{ inputs.include_e2e }}
        run: |
          echo "::warning::M2b.8 part 3: no native tauri-driver E2E harness yet — leg is a documented no-op."
          echo "Verify the native shell manually on Linux until src-tauri/tests/ lands."
          echo "Legs 1+2 (cargo check + tauri build) now run on push/PR via ci.yml's 'rust' job."
          exit 0

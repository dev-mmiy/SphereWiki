name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  e2e:
    name: e2e (Playwright, real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The desktop e2e harness drives a real Chromium against the Vite dev server (which Playwright
      # starts itself in CI, since reuseExistingServer is false when $CI is set).
      - run: pnpm --filter @spherewiki/desktop exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7

  # Native shell — Rust gate (Tauri 2 / WRY → webkit2gtk-sys 4.1 link on Linux).
  #
  # This is the *authoritative* signal for the native shell: `cargo check` catches the
  # webkit2gtk link (a real `pkg-config` symbol resolve), and `tauri build` produces a
  # Linux binary that exercises the native+frontend build wiring end-to-end. macOS
  # already runs these locally (webkit2gtk ships with Xcode; ≈39s), so this is the new
  # *Linux* signal that a browser-only CI suite can't give.
  #
  # Added 2026-11-12 (PR that promotes M2b.8 legs 1+2 out of
  # `.github/workflows/desktop-native.yml`, after the first Linux run went green —
  # run 43135310353 on main @ f1f9845, ~21m54s on Ubuntu 26).
  #
  # Leg 3 (native tauri-driver E2E in `apps/desktop/src-tauri/tests/`) is NOT in this
  # job by design: tauri-driver drives only Linux/webkit2gtk, and a harness does not
  # exist yet — it lands behind `.github/workflows/desktop-native.yml`'s `include_e2e`
  # input. When that harness ships, the E2E step is promoted here too, then
  # `desktop-native.yml` is deleted (see `docs/Todo.md` → M2b.8 parts 1 + 3, "Promotion
  # path"). Until then, `desktop-native.yml` is a *placeholder* that documents leg 3's
  # shape and runs only on `workflow_dispatch`.
  rust:
    name: rust · tauri (Linux, webkit2gtk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mirrors .tool-versions (rust 1.96.1) so the link check reproduces the pinned
      # toolchain, not the runner's distro Rust.
      - name: "Rust toolchain (mirrors .tool-versions — rust 1.96.1)"
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - uses: pnpm/action-setup@v4 # reads the pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Tauri 2 (wry → webkit2gtk-sys 4.1) links these Linux system libs; they ship with
      # Xcode on macOS, which is exactly why this is Linux-only. This apt set IS the "one
      # new signal" — the webkit2gtk link path a bare ubuntu runner can't do without it.
      - name: Install Tauri 2 Linux system deps (webkit2gtk / gtk / appindicator / rsvg)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - run: pnpm install --frozen-lockfile

      # (1) cargo check — the Rust gate; proves the webkit2gtk link on Linux.
      - name: cargo check
        run: pnpm --filter @spherewiki/desktop run check:rust

      # (2) tauri build — the link + native-compile signal. `--no-bundle` skips the slow
      #     .deb/.appimage installer packaging (a release path, not the CI gate) and needs
      #     neither dpkg nor fpm; the signal we want is "the binary links + the native code
      #     compiles". (tauri.conf's `beforeBuildCommand: pnpm build` builds the frontend
      #     dist first, so this also exercises the native↔frontend build wiring.)
      - name: tauri build (binary, no installer packaging)
        run: pnpm --filter @spherewiki/desktop exec tauri build --no-bundle --debug
